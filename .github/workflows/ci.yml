name: CI

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check and test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Show toolchain version
        run: moon version --all

      - name: Check formatting
        run: moon fmt --check

      - name: Check packaged license
        run: cmp LICENSE moonback/LICENSE

      - name: Check warnings
        run: moon check --deny-warn

      - name: Run tests
        run: moon test --deny-warn

      - name: Check generated interfaces
        run: |
          moon info
          git diff --exit-code
