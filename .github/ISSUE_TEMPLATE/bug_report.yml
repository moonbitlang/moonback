name: Bug report
description: Report reproducible incorrect behavior in MoonBack
title: "[Bug]: "
labels:
  - bug
body:
  - type: checkboxes
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues for this problem.
          required: true
        - label: I reproduced the problem with the latest MoonBack release.
          required: true
  - type: input
    id: moonback-version
    attributes:
      label: MoonBack version
      placeholder: 0.8.2
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include your operating system and the output of `moon version --all`.
      render: text
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Provide code and exact commands that reproduce the problem.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include complete errors or logs with secrets removed.
    validations:
      required: true
  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
